plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getCommitCount = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim().toInteger()
}

android {
    namespace 'com.danemadsen.maise'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.danemadsen.maise"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode getCommitCount()
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    bundle {
        abi {
            enableSplit true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()
                    && keystoreProperties['storeFile']
                    && keystoreProperties['storePassword']
                    && keystoreProperties['releaseAlias']
                    && keystoreProperties['releasePassword']) {
                    
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['releaseAlias']
                keyPassword keystoreProperties['releasePassword']
            } else {
                println("⚠️ Keystore properties not found or incomplete; release builds will use debug signing unless you add key.properties.")
                // NOTE: don't set signingConfig here
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Prevent re-compression of large model files so they can be memory-mapped directly
    aaptOptions {
        noCompress 'onnx', 'bin'
    }

    testOptions {
        unitTests {
            // KokoroPhonemeTokenizer logs via android.util.Log in JVM tests
            returnDefaultValues = true
        }
    }

    assetPacks = [':kokoro', ':whisper']
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // WebRTC Voice Activity Detection — vendored from GitHub releases (avoids JitPack)
    implementation files('libs/android-vad-webrtc-v2.0.9.aar')

    // English G2P (vendored from GrapheneOS SpeechServices)
    implementation 'org.apache.opennlp:opennlp-tools:2.5.10'
    implementation 'com.ibm.icu:icu4j:78.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'androidx.collection:collection:1.5.0'        // buildIntObjectMap/buildIntIntMap (1.5.0+)
    implementation 'org.slf4j:slf4j-nop:2.0.18'

    // opennlp 2.5.10 uses Java 17 records — desugaring provides java.lang.Record below API 34
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
